- name: Install GNOME Caffeine extension
  hosts: devs
  become: true
  vars:
    devmachine_gnome_caffeine_user: >-
      {{
        devmachine_gnome_extensions_user
        if (devmachine_gnome_extensions_user is defined and (devmachine_gnome_extensions_user | length > 0))
        else (
          devmachine_end_user
          if (devmachine_end_user is defined and (devmachine_end_user | length > 0))
          else ansible_user
        )
      }}
    devmachine_gnome_caffeine_uuid: caffeine@patapon.info
    devmachine_gnome_caffeine_repo: "https://github.com/eonpatapon/gnome-shell-extension-caffeine.git"
    devmachine_gnome_caffeine_version_by_shell:
      "40": gnome-shell-40-42
      "41": gnome-shell-40-42
      "42": gnome-shell-40-42
      "43": gnome-shell-43-44
      "44": gnome-shell-43-44
      "45": master
      "46": master
      "47": master
      "48": master
      "49": master
      "50": master

  handlers:
    - name: Compile GNOME Caffeine schemas
      ansible.builtin.command:
        argv:
          - glib-compile-schemas
          - "{{ devmachine_gnome_extensions_home }}/.local/share/gnome-shell/extensions/{{ devmachine_gnome_caffeine_uuid }}/schemas"
      become: true
      become_user: "{{ devmachine_gnome_caffeine_user }}"
      environment:
        HOME: "{{ devmachine_gnome_extensions_home }}"
      changed_when: true

  tasks:
    - name: Install GNOME Caffeine prerequisites
      ansible.builtin.apt:
        name:
          - dbus-user-session
          - dconf-cli
          - git
          - libglib2.0-bin
          - rsync
        state: present
        update_cache: true

    - name: Verify GNOME Shell is installed
      ansible.builtin.command:
        cmd: gnome-shell --version
      register: devmachine_gnome_shell_version
      changed_when: false
      failed_when: false

    - name: Assert GNOME Shell is available
      ansible.builtin.assert:
        that:
          - devmachine_gnome_shell_version.rc == 0
        fail_msg: "GNOME Shell is required to install Caffeine."

    - name: Resolve GNOME Shell major version
      ansible.builtin.set_fact:
        devmachine_gnome_shell_major: "{{ devmachine_gnome_shell_version.stdout | regex_search('[0-9]+') }}"

    - name: Resolve Caffeine git version
      ansible.builtin.set_fact:
        devmachine_gnome_caffeine_git_version: >-
          {{
            devmachine_gnome_caffeine_version
            | default(
              devmachine_gnome_caffeine_version_by_shell[devmachine_gnome_shell_major]
              | default("master")
            )
          }}

    - name: Read GNOME extensions user account information
      ansible.builtin.getent:
        database: passwd
        key: "{{ devmachine_gnome_caffeine_user }}"

    - name: Resolve GNOME extensions user home
      ansible.builtin.set_fact:
        devmachine_gnome_extensions_home: "{{ ansible_facts.getent_passwd[devmachine_gnome_caffeine_user][4] }}"

    - name: Ensure GNOME Shell extensions directory exists
      ansible.builtin.file:
        path: "{{ devmachine_gnome_extensions_home }}/.local/share/gnome-shell/extensions"
        state: directory
        owner: "{{ devmachine_gnome_caffeine_user }}"
        mode: "0755"

    - name: Ensure GNOME Caffeine source cache directory exists
      ansible.builtin.file:
        path: "{{ devmachine_gnome_extensions_home }}/.cache/devmachine"
        state: directory
        owner: "{{ devmachine_gnome_caffeine_user }}"
        mode: "0755"

    - name: Clone GNOME Caffeine extension source
      ansible.builtin.git:
        repo: "{{ devmachine_gnome_caffeine_repo }}"
        dest: "{{ devmachine_gnome_extensions_home }}/.cache/devmachine/gnome-shell-extension-caffeine"
        version: "{{ devmachine_gnome_caffeine_git_version }}"
        clone: true
        update: true
      become: true
      become_user: "{{ devmachine_gnome_caffeine_user }}"
      environment:
        HOME: "{{ devmachine_gnome_extensions_home }}"

    - name: Sync GNOME Caffeine extension files
      ansible.builtin.command:
        argv:
          - rsync
          - -a
          - --delete
          - --itemize-changes
          - "{{ devmachine_gnome_extensions_home }}/.cache/devmachine/gnome-shell-extension-caffeine/{{ devmachine_gnome_caffeine_uuid }}/"
          - "{{ devmachine_gnome_extensions_home }}/.local/share/gnome-shell/extensions/{{ devmachine_gnome_caffeine_uuid }}/"
      register: devmachine_gnome_caffeine_sync
      changed_when: devmachine_gnome_caffeine_sync.stdout | length > 0
      notify: Compile GNOME Caffeine schemas

    - name: Flush GNOME Caffeine handlers
      ansible.builtin.meta: flush_handlers

    - name: Verify Caffeine metadata is present
      ansible.builtin.stat:
        path: "{{ devmachine_gnome_extensions_home }}/.local/share/gnome-shell/extensions/{{ devmachine_gnome_caffeine_uuid }}/metadata.json"
      register: devmachine_gnome_caffeine_metadata

    - name: Assert Caffeine extension was installed
      ansible.builtin.assert:
        that:
          - devmachine_gnome_caffeine_metadata.stat.exists
        fail_msg: "Caffeine metadata.json was not found after sync."

    - name: Read enabled GNOME Shell extensions
      ansible.builtin.command:
        argv:
          - dbus-run-session
          - --
          - gsettings
          - get
          - org.gnome.shell
          - enabled-extensions
      become: true
      become_user: "{{ devmachine_gnome_caffeine_user }}"
      environment:
        HOME: "{{ devmachine_gnome_extensions_home }}"
      register: devmachine_gnome_enabled_extensions_raw
      changed_when: false

    - name: Resolve enabled GNOME Shell extensions
      ansible.builtin.set_fact:
        devmachine_gnome_enabled_extensions: "{{ devmachine_gnome_enabled_extensions_raw.stdout | regex_findall(\"'([^']+)'\") }}"

    - name: Enable GNOME Caffeine extension
      ansible.builtin.command:
        argv:
          - dbus-run-session
          - --
          - gsettings
          - set
          - org.gnome.shell
          - enabled-extensions
          - "{{ devmachine_gnome_enabled_extensions_target }}"
      become: true
      become_user: "{{ devmachine_gnome_caffeine_user }}"
      environment:
        HOME: "{{ devmachine_gnome_extensions_home }}"
      vars:
        devmachine_gnome_enabled_extensions_target: >-
          ['{{ ((devmachine_gnome_enabled_extensions + [devmachine_gnome_caffeine_uuid]) | unique | list) | join("', '") }}']
      when: devmachine_gnome_caffeine_uuid not in devmachine_gnome_enabled_extensions
      changed_when: true

    - name: Read enabled GNOME Shell extensions after update
      ansible.builtin.command:
        argv:
          - dbus-run-session
          - --
          - gsettings
          - get
          - org.gnome.shell
          - enabled-extensions
      become: true
      become_user: "{{ devmachine_gnome_caffeine_user }}"
      environment:
        HOME: "{{ devmachine_gnome_extensions_home }}"
      register: devmachine_gnome_enabled_extensions_after_raw
      changed_when: false

    - name: Assert GNOME Caffeine extension is enabled
      ansible.builtin.assert:
        that:
          - devmachine_gnome_caffeine_uuid in (devmachine_gnome_enabled_extensions_after_raw.stdout | regex_findall("'([^']+)'"))
        fail_msg: "Caffeine extension is installed but not enabled."
